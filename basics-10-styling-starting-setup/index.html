<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue Basics</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/vue@3.5.28/dist/vue.global.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Vue Dynamic Styling</h1>
    </header>
    <section id="styling">
      <div class="demo"
        :class="boxASelected ? 'demo active' : 'demo'"
        @click="boxSelected('A')"
      >
        <p>A</p>
      </div>
      <div 
        :class="{demo: true, active: boxBSelected}"
        @click="boxSelected('B')"
      >
        <p>B</p>
      </div>
      <div 
        class="demo"
        :class="{active: boxCSelected}"
        @click="boxSelected('C')"
      >
        <p>C</p>
      </div>
      <div 
        class="demo"
        :class="boxDClasses"
        @click="boxSelected('D')"
      >
        <p>D</p>
      </div>
      <div 
        :class="['demo', {active: boxESelected}]"
        @click="boxSelected('E')"
      >
        <p>E</p>
      </div>
    </section>
  </body>
</html>
